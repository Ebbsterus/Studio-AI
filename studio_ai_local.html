<!--
  Studio AI Chat Widget — Local 5080 version
  Talks directly to Ollama on localhost:11434 (no FastAPI needed)
-->

<style>
  #studio-chat-bubble {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #c9a84c; border: none; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    font-size: 24px; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  #studio-chat-bubble:hover { transform: scale(1.08); }

  #studio-chat-box {
    display: none; position: fixed; bottom: 92px; right: 24px;
    width: 340px; max-height: 520px;
    background: #1a1a1a; border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    font-family: system-ui, sans-serif;
    flex-direction: column; overflow: hidden;
    z-index: 9998;
  }
  #studio-chat-box.open { display: flex; }

  #studio-chat-header {
    background: #c9a84c; padding: 14px 18px;
    color: #111; font-weight: 700; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #studio-chat-close {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: #111; line-height: 1;
  }

  #studio-chat-messages {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.bot  { background: #2a2a2a; color: #eee; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #c9a84c; color: #111; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }

  #studio-chat-input-row {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2a2a;
  }
  #studio-chat-input {
    flex: 1; background: #2a2a2a; border: none; border-radius: 8px;
    color: #eee; padding: 10px 12px; font-size: 14px; outline: none;
  }
  #studio-chat-input::placeholder { color: #666; }
  #studio-chat-send {
    background: #c9a84c; border: none; border-radius: 8px;
    color: #111; font-weight: 700; padding: 10px 16px;
    cursor: pointer; font-size: 14px;
  }
  #studio-chat-send:disabled { opacity: 0.5; cursor: default; }
  .typing { color: #666; font-style: italic; font-size: 13px; }

  body { margin: 0; background: #111; min-height: 100vh; }
  .hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #555; font-family: system-ui; font-size: 13px; }
</style>

<div class="hint">Studio AI — Local (RTX 5080)</div>
<button id="studio-chat-bubble" aria-label="Chat with Studio AI">💬</button>

<div id="studio-chat-box">
  <div id="studio-chat-header">
    <span>Studio AI Assistant</span>
    <button id="studio-chat-close" aria-label="Close">✕</button>
  </div>
  <div id="studio-chat-messages">
    <div class="msg bot">Hi! I can help with questions about our AI headshot service — pricing, how it works, or what photos to upload. What would you like to know?</div>
  </div>
  <div id="studio-chat-input-row">
    <input id="studio-chat-input" type="text" placeholder="Ask a question..." maxlength="300" />
    <button id="studio-chat-send">Send</button>
  </div>
</div>

<script>
  const OLLAMA_URL = "http://localhost:11434/api/chat";
  const MODEL      = "studio-ai";

  const bubble   = document.getElementById("studio-chat-bubble");
  const box      = document.getElementById("studio-chat-box");
  const closeBtn = document.getElementById("studio-chat-close");
  const messages = document.getElementById("studio-chat-messages");
  const input    = document.getElementById("studio-chat-input");
  const sendBtn  = document.getElementById("studio-chat-send");

  bubble.addEventListener("click", () => box.classList.toggle("open"));
  closeBtn.addEventListener("click", () => box.classList.remove("open"));

  function addMessage(text, role) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;

    addMessage(text, "user");
    const typing = addMessage("Typing...", "bot typing");

    try {
      const res = await fetch(OLLAMA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          messages: [{ role: "user", content: text }],
          stream: false,
        }),
      });
      const data = await res.json();
      typing.textContent = data.message.content;
      typing.classList.remove("typing");
    } catch (e) {
      typing.textContent = "Sorry, couldn't reach the model. Is Ollama running?";
      typing.classList.remove("typing");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
